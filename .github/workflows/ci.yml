# بوابات ما قبل الدمج — وثيقة 05 §2:
# Pint، PHPStan/Larastan، ESLint، TypeScript، Unit/Feature tests، فحص الأسرار.
name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php-quality:
        name: PHP — Pint, PHPStan, Tests
        runs-on: ubuntu-latest

        services:
            pgsql:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: hiroote_test
                    POSTGRES_USER: hiroote
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -q -d hiroote_test -U hiroote"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, redis, intl, zip
                  coverage: none

            - name: Install composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Pint (code style)
              run: ./vendor/bin/pint --test

            - name: PHPStan (static analysis)
              run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Tests
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: hiroote_test
                  DB_USERNAME: hiroote
                  DB_PASSWORD: secret
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php artisan test

    frontend-quality:
        name: Frontend — ESLint, tsc, Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Prettier (format check)
              run: npm run format:check

            - name: ESLint
              run: npm run lint

            - name: TypeScript
              run: npm run types

            - name: Build
              run: npm run build

    secret-scan:
        name: Secret scanning
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
