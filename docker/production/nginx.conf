# nginx داخل حاوية التطبيق — خلف Caddy الذي يُنهي TLS.
#
# لا ترويسات أمان هنا: Caddy هي البوّابة الخارجية وتضبطها، و`header` فيها
# **يستبدل** لا يضيف. تكرارُها في الطبقتين يجعل تعديل إحداهما بلا أثر ظاهر.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # الرفع: صور الشاشات في قاعدة المعرفة أكبر ما يمرّ.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # ⚠️ **لا `real_ip_header` هنا — ولا تُعِدْه.**
        #
        # كان هنا `set_real_ip_from 0.0.0.0/0; real_ip_header X-Forwarded-For;`
        # بحجّةٍ سليمة: أن يُسجَّل الزائر بعنوانه لا بعنوان البوّابة. وأثرُه أنه
        # يستبدل `REMOTE_ADDR` بعنوانٍ **عامّ**.
        #
        # ولارافل يثق بالنطاقات الخاصة وحدها (`bootstrap/app.php`)، فرأى عنوانًا
        # عامًّا فلم يثق به، فتجاهل `X-Forwarded-Proto: https`، فبنى روابط الأصول
        # بـ`http` داخل صفحةٍ على `https` — فحجبها المتصفح، وكانت النتيجة **شاشة
        # بيضاء** بلا خطأ في أي سجلّ خادم (كل الطلبات ٢٠٠).
        #
        # فحارسان بُنيا لسببين صحيحين أبطل أحدهما الآخر. والحلّ أن يكون استخراج
        # عنوان الزائر في **موضع واحد**: لارافل يقرأ `X-Forwarded-For` بنفسه بعد
        # أن يثق بالبوّابة — فيصحّ `$request->ip()` وتصحّ `isSecure()` معًا.
        #
        # وثمنُه أن سجلّ nginx يذكر عنوان البوّابة لا الزائر. وسجلّ Caddy يحمل
        # عنوان الزائر الحقيقي، وسجلّ تدقيق هاي روت كذلك.

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # أصول Vite مبصومة بمحتواها، فالتخزين الطويل آمن: تغيّر الملف يغيّر اسمه.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            # نداء المزود قد يطول: مهلةٌ أقصر من مهلة المزود تقطع ردًّا في طريقه
            # فتُحتسب كلفتُه ولا يصل المستخدم شيء.
            fastcgi_read_timeout 120;
        }

        # ما تحت `.` لا يُخدَم: `.env` و`.git` أولها.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
