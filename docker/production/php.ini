; إعداد PHP للإنتاج — ما يخالف الافتراضي فقط، ولكلٍّ سببه.

memory_limit = 512M
max_execution_time = 120

; الرفع: صور شاشات قاعدة المعرفة. المُحدِّد الفعلي هو الأصغر بين هذا و
; `client_max_body_size` في nginx — فيُضبطان معًا وإلا رُفض الملف عند أحدهما
; برسالةٍ لا تشبه الأخرى.
upload_max_filesize = 20M
post_max_size = 24M

expose_php = Off

; الأخطاء تُسجَّل ولا تُعرض: أثرُ الاستدعاء على الشاشة يكشف المسارات والإعداد
; لكل زائر.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Asia/Riyadh

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; الكود لا يتغيّر داخل الصورة، فلا فحص لتاريخ الملفات. والنشر يستبدل الحاوية.
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 16
