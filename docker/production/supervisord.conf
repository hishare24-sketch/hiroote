; حاوية الويب وحدها تستعمل هذا الملف — الطابور والمجدول يتجاوزان الأمر.
;
; `autorestart=false` مقصودة: سقوط nginx أو php-fpm يجب أن يُسقط الحاوية كلها
; فيعيدها Docker ويظهر الخلل في `docker ps`. وإعادةُ تشغيل عمليةٍ داخل حاوية
; تبدو حيّة تُخفي عطلًا متكررًا.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
command=sh -c 'printf "READY\n"; while read -r _; do kill -SIGQUIT "$PPID"; printf "RESULT 2\nOK"; done'
